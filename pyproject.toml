[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laser-cut-qr-sign-maker"
version = "0.3.5"
description = "Design a static QR code with styled modules and turn it into a two-piece laser-cut tabletop sign (LightBurn-ready SVG)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jonathan Hunt" }]
keywords = ["qr-code", "laser-cutter", "lightburn", "svg", "3mf", "3d-printing", "nicegui"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "fonttools>=4.40",
    "svgelements>=1.9",
    "pillow>=10",
    "shapely>=2.0",
    "segno>=1.6",
    "numpy>=1.24",
    "potracer>=0.0.4",
    "zxing-cpp>=2.2",
    "nicegui>=2.0",
    "mapbox_earcut>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qrsign = "qrsign.app:main"
laser-qr = "qrsign.signmaker:main"

[project.urls]
Homepage = "https://github.com/ecodad/laser-cut-qr-sign-maker"

[tool.setuptools]
packages = ["qrsign"]
